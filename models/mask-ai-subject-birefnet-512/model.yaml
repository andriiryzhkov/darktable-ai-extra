id: mask-ai-subject-birefnet-512
name: "mask subject birefnet 512"
description: "BiRefNet (Swin Large) trained at 512x512 for faster automatic subject / foreground segmentation"
task: mask-ai-subject
version: "0.1"
arch: birefnet
type: single
tiling: false
dep_group: birefnet

# Measured against the exported graph, not copied from upstream docs.
attributes:
  # Spatial dims are baked in at 512x512; nothing about the graph is
  # dynamic, so the whole frame is resampled to fit rather than tiled.
  input_sizes: [512]
  fixed_spatial: true
  color_space: rgb
  strategy: resize_whole_image

  input_names: [input_image]
  output_names: [output_image]
  # input: [1,3,512,512] RGB in [0,1], then ImageNet-normalized. The fp16
  # package keeps float32 at the graph boundary and casts internally, so a
  # caller feeds float32 either way.
  input_range: [0.0, 1.0]
  input_mean: [0.485, 0.456, 0.406]
  input_std: [0.229, 0.224, 0.225]
  # output: [1,1,512,512] logits, measured around -72..64. A consumer
  # applies sigmoid and gets a soft alpha, not a binary mask.
  output_logits: true
  # One forward pass returns the dominant subject; there are no click
  # prompts.
  prompts: false

model_card:
  long_description: "BiRefNet with the Swin Large backbone of the full model, trained at 512x512 rather than 1024x1024. A quarter of the pixels makes it about four times faster than BiRefNet, and it is the cleanest of the subject models here around the subject: it leaves the least mask on what lies next to it. In busy scenes, such as a ship's bow with rigging, it can miss large parts of the subject. Pick it for speed on scenes with one clear subject; pick BiRefNet for busy ones"
  scope: "automatic subject / foreground segmentation"
  author: "Peng Zheng et al."
  source: "https://huggingface.co/ZhengPeng7/BiRefNet_512x512"
  paper: "https://arxiv.org/abs/2401.03407"
  license: "MIT"
  training_data: "not stated on the model card, which reports results on DIS-VD; the card of the general BiRefNet says the DIS models are trained on DIS-TR, the training split of DIS5K"
  training_data_license: "unknown: the training data is not stated"
  notes: "Swin Large (swin_v1_l) backbone, about 232M parameters, as in the full BiRefNet; upstream trained it at 512x512 'for faster and more accurate lower resolution inference'. On DIS-VD at 512x512 upstream reports maxF .879 and MAE .040, against .834 and .050 for the general BiRefNet run at 512x512"

checkpoints:
  # FP16 variant by default (452 MiB). For FP32 (897 MiB) change the URL
  # to `onnx/model.onnx` from the same HF path. Both keep float32 at the
  # graph boundary, so a caller sees the same I/O either way.
  - url: "https://huggingface.co/onnx-community/BiRefNet_512x512-ONNX/resolve/main/onnx/model_fp16.onnx"
    path: "output/mask-ai-subject-birefnet-512/model.onnx"
